name: medtrack
description: >
  MedTrack — mobile app for medication dispensing reminders and
  patient symptom tracking.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management & DI
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3

  # Local persistence
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.2.1

  # Charts for symptom/adherence trends
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
